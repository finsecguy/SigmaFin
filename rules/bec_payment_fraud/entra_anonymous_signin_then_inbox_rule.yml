title: Finance Anonymous Sign-in Correlation Input
id: 7a4f1c92-5d08-4b36-9e71-c3b8a0d2f645
name: entra_finance_anonymous_signin_event
status: experimental
description: |
    Support rule for entra_anonymous_signin_then_inbox_rule. Its detection must stay identical to the standalone rule
    entra_finance_signin_anonymous_ip; scripts/check_metadata.py fails the build if the two diverge.
    It exists because pySigma does not output a rule that a correlation references. Keeping the correlation on its own
    copy lets entra_finance_signin_anonymous_ip alert on its own even when the whole rules directory is converted at
    once. Do not deploy this rule standalone. No ATT&CK technique is tagged on this support rule because the
    standalone rule carries it.
references:
    - https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
author: SigmaFin Contributors
date: 2026-10-20
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        UserPrincipalName|expand: '%finance_users%'
        ResultType: 0
        RiskEventTypes_V2|contains: anonymizedIPAddress
    condition: selection
falsepositives:
    - Every match of the standalone rule is a match here, which is why this is only used as a correlation input
level: informational
