title: Vendor Created (Correlation Input)
id: 52dd0c17-11e1-44e3-bd27-0711d4f0fec7
name: erp_new_vendor_created_event
status: experimental
description: |
    Support rule for erp_new_vendor_paid_quickly. Matches
    every successful vendor creation in the vendor-neutral ERP schema (logsource product erp, service vendor_master).
    It is not an alert on its own: every legitimate vendor onboarding matches it. Do not deploy it standalone.
    No ATT&CK technique applies to a vendor creation by itself, so no technique tag is set.
    The correlation erp_vendor_created_and_payment_approved_by_same_user has its own copy of this condition
    (erp_sod_vendor_created_event), because a support rule that two correlations share makes pySigma fail when the
    whole rules directory is converted. scripts/check_metadata.py fails the build if the copies diverge.
references:
    - https://www.criadv.com/insight/unearthing-occupational-fraud-in-your-business
author: SigmaFin Contributors
date: 2026-10-20
logsource:
    product: erp
    service: vendor_master
detection:
    selection:
        action: vendor_created
        status: success
    condition: selection
falsepositives:
    - Every legitimate vendor onboarding matches, which is why this is only used as a correlation input
level: informational
