title: Vendor Payment Released (New Vendor Correlation Input)
id: 294df00d-9ea2-4092-adef-547fe7ebb78a
name: erp_new_vendor_payment_released_event
status: experimental
description: |
    Support rule for erp_new_vendor_paid_quickly. Its detection must stay identical to erp_vendor_payment_released, the
    support rule of the bank change correlation; scripts/check_metadata.py fails the build if the two diverge.
    It is a separate copy because a support rule that two correlations share makes pySigma fail when the whole
    rules directory is converted. Do not deploy this rule standalone.
    No ATT&CK technique applies to a payment release by itself, so no technique tag is set.
references:
    - https://www.criadv.com/insight/unearthing-occupational-fraud-in-your-business
author: SigmaFin Contributors
date: 2026-10-20
logsource:
    product: erp
    service: payments
detection:
    selection:
        action: payment_released
        status: success
    condition: selection
falsepositives:
    - Every legitimate payment run matches this rule, which is why it is only used as a correlation input
level: informational
