title: New Vendor Created Then Paid Within Three Days
id: 77b79c4a-42a8-4dd5-b6ab-98e2aa76b450
name: erp_new_vendor_paid_quickly
status: experimental
description: |
    Detects a payment released to a vendor within 3 days after that vendor was created, grouped by vendor_id. The
    creation must come first (temporal_ordered).
    A fictitious vendor, often called a shell company, is a classic billing scheme: someone in a position to add
    vendors creates one that exists only on paper, then gets invoices for work never done paid to it. A very short
    time between creation and the first payment is one of the few signals the ERP log offers. A vendor that is created
    and paid within days is also what an urgent legitimate onboarding looks like, so the rule is a prompt for review.
    No ATT&CK technique applies. This is business process fraud, tagged with no ATT&CK technique.
    The 3 day window is a starting point. Tune it to your onboarding process, which may be much longer, and consider
    suppressing vendors created through an approved onboarding workflow.
    Needs a backend with temporal_ordered correlation support. The pySigma Splunk backend 2.1.0 does not convert it,
    so this rule is tested on the SQLite backend only and has no SPL output.
references:
    - https://www.criadv.com/insight/unearthing-occupational-fraud-in-your-business
    - https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-5/
author: SigmaFin Contributors
date: 2026-10-20
correlation:
    type: temporal_ordered
    rules:
        - erp_new_vendor_created_event
        - erp_new_vendor_payment_released_event
    group-by:
        - vendor_id
    timespan: 3d
    generate: false
falsepositives:
    - Urgent but legitimate onboarding, such as a one-off supplier for an emergency repair, paid on a rush invoice
    - Employee reimbursement or expense vendors created and paid in the same run
    - Vendors migrated or re-created in a system change, then paid in the next scheduled run
level: medium
