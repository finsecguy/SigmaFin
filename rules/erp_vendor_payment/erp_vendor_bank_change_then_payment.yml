title: Vendor Bank Details Changed (Correlation Input)
id: b5d7c2f1-3a98-4e60-8c4d-1f6a9e0b7d33
name: erp_vendor_bank_change_event
status: experimental
description: |
    Support rule for erp_vendor_bank_change_then_payment. Its detection must stay identical to the standalone rule
    erp_vendor_bank_details_changed; scripts/check_metadata.py fails the build if the two diverge.
    It exists because pySigma does not output a rule that a correlation references. Keeping the correlation on its own
    copy lets erp_vendor_bank_details_changed alert on its own even when the whole rules directory is converted at once.
    Do not deploy this rule standalone. No ATT&CK technique is tagged on this support rule because the standalone rule
    carries it.
references:
    - https://attack.mitre.org/techniques/T1657/
author: SigmaFin Contributors
date: 2026-10-20
logsource:
    product: erp
    service: vendor_master
detection:
    selection:
        action: vendor_updated
        status: success
        field_changed:
            - bank_account_number
            - iban
            - bank_routing_number
            - swift_bic
            - bank_name
            - bank_country
    condition: selection
falsepositives:
    - Every legitimate bank detail change matches, which is why this is only used as a correlation input
level: informational
