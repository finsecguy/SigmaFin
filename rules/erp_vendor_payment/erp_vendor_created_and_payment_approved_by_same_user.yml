title: Vendor Created (Segregation of Duties Correlation Input)
id: d7d1350e-65d8-4b44-8c94-e736187e6f0f
name: erp_sod_vendor_created_event
status: experimental
description: |
    Support rule for erp_vendor_created_and_payment_approved_by_same_user. Its detection must stay identical to
    erp_new_vendor_created_event; scripts/check_metadata.py fails the build if the two diverge.
    It is a separate copy because a support rule that two correlations share makes pySigma fail when the whole
    rules directory is converted. Do not deploy this rule standalone.
    No ATT&CK technique applies to a vendor creation by itself, so no technique tag is set.
references:
    - https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-5/
author: SigmaFin Contributors
date: 2026-10-20
logsource:
    product: erp
    service: vendor_master
detection:
    selection:
        action: vendor_created
        status: success
    condition: selection
falsepositives:
    - Every legitimate vendor onboarding matches, which is why this is only used as a correlation input
level: informational
---
title: Vendor Payment Approved (Correlation Input)
id: 705abc5c-ae0b-44d1-ac4e-5530b3a81f79
name: erp_sod_payment_approved_event
status: experimental
description: |
    Support rule for erp_vendor_created_and_payment_approved_by_same_user. Matches every successful payment approval in
    the vendor-neutral ERP schema (logsource product erp, service payments). The account that approved is the user
    field of the event.
    It is not an alert on its own: every legitimate approval matches it. Do not deploy it standalone.
    No ATT&CK technique applies to a payment approval by itself, so no technique tag is set.
references:
    - https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-5/
author: SigmaFin Contributors
date: 2026-10-20
logsource:
    product: erp
    service: payments
detection:
    selection:
        action: payment_approved
        status: success
    condition: selection
falsepositives:
    - Every legitimate payment approval matches, which is why this is only used as a correlation input
level: informational
