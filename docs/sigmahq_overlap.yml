# Record of the SigmaHQ overlap check done before each rule was written.
# Source: https://github.com/SigmaHQ/sigma, shallow clones. Rules up to erp_vendor_bank_change_event were checked at
# commit f083329 (2026-10-19). Rules added later were checked at commit e3f4662 (2026-10-20).
# Searched directories: rules, rules-threat-hunting, rules-emerging-threats.
# decision is one of: keep (no equivalent), keep-scoped (equivalent exists, our rule adds finance scoping), drop.
rules:
  m365_inbox_rule_external_forward_finance:
    search_terms: [inboxrule, "inbox rule", ForwardingSmtp, forwarding]
    overlap:
      - id: c726e007-2cd0-4a55-abfb-79730fbedee5
        path: rules-threat-hunting/cloud/m365/audit/microsoft365_susp_email_forwarding_activity.yml
        note: Matches any forwarding parameter on New-InboxRule, Set-InboxRule and Set-Mailbox, with no recipient domain check and no account scoping. Level medium, threat hunting.
      - id: d3577be1-42c9-44a7-b56e-2e8de97349d3
        path: rules-threat-hunting/cloud/m365/audit/microsoft365_susp_inbox_rule_creation_or_update_activity.yml
        note: Any hiding or moving inbox rule. Related to the planned finance hide-rule detection, not to this rule.
      - id: 27e4f1d6-ae72-4ea0-8a67-77a73a289c3d
        path: rules/cloud/azure/identity_protection/azure_identity_protection_inbox_forwarding_rule.yml
        note: Wraps an Entra ID Protection risk detection. Different log source.
    decision: keep-scoped
    scoping_added: Finance account scope (finance_mailboxes placeholder) and an external recipient check (internal_domains placeholder).
  erp_vendor_bank_details_changed:
    search_terms: [vendor, "bank account", "bank detail", vendor_master, payment_run, "accounts payable"]
    overlap: []
    decision: keep
    scoping_added: SigmaHQ has no ERP or accounts payable rules.
  erp_vendor_payment_released:
    search_terms: [vendor, payment_run, "accounts payable"]
    overlap: []
    decision: keep
    scoping_added: Support rule for a correlation. SigmaHQ has no ERP or accounts payable rules.
  erp_vendor_bank_change_then_payment:
    search_terms: [vendor, "bank account", payment_run, "accounts payable"]
    overlap: []
    decision: keep
    scoping_added: SigmaHQ has no ERP or accounts payable rules.
  erp_vendor_bank_change_event:
    search_terms: [vendor, "bank account", "bank detail", vendor_master]
    overlap: []
    decision: keep
    scoping_added: Support rule that mirrors erp_vendor_bank_details_changed for use inside a correlation. SigmaHQ has no ERP or accounts payable rules.
  m365_inbox_rule_hides_finance_mail:
    search_terms: [inbox rule, InboxRule, MoveToFolder, DeleteMessage, mailbox]
    overlap:
      - id: d3577be1-42c9-44a7-b56e-2e8de97349d3
        path: rules-threat-hunting/cloud/m365/audit/microsoft365_susp_inbox_rule_creation_or_update_activity.yml
        note: Matches any New-InboxRule or Set-InboxRule whose parameters mention DeleteMessage, MarkAsRead, MoveToFolder or SubjectOrBodyContainsWords. No account scoping, no finance keywords, no check of the destination folder. Level medium, threat hunting.
      - id: 27e4f1d6-ae72-4ea0-8a67-77a73a289c3d
        path: rules/cloud/azure/identity_protection/azure_identity_protection_inbox_forwarding_rule.yml
        note: Wraps an Entra ID Protection risk detection about forwarding. Different log source and purpose.
    decision: keep-scoped
    scoping_added: Finance account scope (finance_mailboxes placeholder), a finance keyword requirement and a check that the rule deletes mail or moves it to a rarely read folder.
  m365_mailbox_forwarding_external_finance:
    search_terms: [Set-Mailbox, ForwardingSmtpAddress, ForwardingAddress, DeliverToMailboxAndForward, forwarding]
    overlap:
      - id: c726e007-2cd0-4a55-abfb-79730fbedee5
        path: rules-threat-hunting/cloud/m365/audit/microsoft365_susp_email_forwarding_activity.yml
        note: Its Set-Mailbox branch matches ForwardingSmtpAddress or ForwardingAddress on any mailbox, with no recipient domain check and no account scoping. Level medium, threat hunting.
    decision: keep-scoped
    scoping_added: Finance mailbox scope (finance_mailboxes placeholder, on the actor or the target mailbox) and an external recipient check (internal_domains placeholder).
  entra_finance_signin_unlisted_country:
    search_terms: [country, countryOrRegion, Location, infrequent, new country, signinlogs]
    overlap:
      - id: adf9f4d2-559e-4f5c-95be-c28dff0b1476
        path: rules/cloud/azure/identity_protection/azure_identity_protection_new_coutry_region.yml
        note: Wraps the Entra ID Protection "New country" risk detection, which needs a P2 and Defender for Cloud Apps license and learns a per user baseline. It has no finance scope and no fixed country list.
      - id: 0f2468a2-5055-4212-a368-7321198ee706
        path: rules/cloud/m365/threat_management/microsoft365_activity_from_infrequent_country.yml
        note: Wraps the Defender for Cloud Apps infrequent country alert. Same difference.
    decision: keep-scoped
    scoping_added: Finance account scope (finance_users placeholder) and a fixed country allowlist (allowed_countries placeholder) that needs no baseline or premium license.
  entra_finance_signin_anonymous_ip:
    search_terms: [anonymous, anonymizedIPAddress, RiskEventTypes, signinlogs, tor]
    overlap:
      - id: 53acd925-2003-440d-a1f3-71a5253fe237
        path: rules/cloud/azure/identity_protection/azure_identity_protection_anonymous_ip_address.yml
        note: Matches the riskdetection log for riskEventType anonymizedIPAddress. No account scoping and no check that the sign-in succeeded. Level high.
    decision: keep-scoped
    scoping_added: Finance account scope (finance_users placeholder) and a successful sign-in requirement, read from the sign-in log RiskEventTypes_V2 column instead of the risk detection log.
  entra_finance_anonymous_signin_event:
    search_terms: [anonymous, anonymizedIPAddress, RiskEventTypes, signinlogs]
    overlap: []
    decision: keep
    scoping_added: Support rule that mirrors entra_finance_signin_anonymous_ip for use inside a correlation. See that rule for the overlap with SigmaHQ.
  m365_inbox_rule_change_event:
    search_terms: [inbox rule, InboxRule, New-InboxRule, Set-InboxRule]
    overlap: []
    decision: keep
    scoping_added: Support rule for a correlation. It matches every inbox rule change. See m365_inbox_rule_hides_finance_mail for the overlap with SigmaHQ.
  entra_anonymous_signin_then_inbox_rule:
    search_terms: [anonymous, anonymizedIPAddress, inbox rule, correlation, temporal]
    overlap: []
    decision: keep
    scoping_added: No SigmaHQ rule correlates an anonymous sign-in with a following inbox rule change on a finance account.
  erp_payment_run_modified_outside_hours:
    search_terms: [payment run, payment_run, outside business hours, after hours, off-hours]
    overlap: []
    decision: keep
    scoping_added: SigmaHQ has no ERP or accounts payable rules and no time-of-day rules for payment runs.
  erp_emergency_access_started:
    search_terms: [firefighter, break glass, breakglass, emergency access]
    overlap: []
    decision: keep
    scoping_added: SigmaHQ has no ERP rules. The only break glass match is a GCP container deployment rule (different product and purpose).
  erp_privileged_role_assigned_without_approval:
    search_terms: [privileged role, role assign, role assigned]
    overlap:
      - id: b1bc08d1-8224-4758-a0e6-fbcfc98c73bb
        path: rules/cloud/azure/privileged_identity_management/azure_pim_role_assigned_outside_of_pim.yml
        note: Entra roles assigned outside Privileged Identity Management. Same idea (assignment outside the approval process) on a different product and log source.
      - id: 49a268a4-72f4-4e38-8a7b-885be690c5b5
        path: rules/cloud/azure/audit_logs/azure_priviledged_role_assignment_add.yml
        note: Entra user added to a privileged role. Different product and log source.
    decision: keep
    scoping_added: SigmaHQ has no ERP rules. The related rules cover Entra roles, not ERP roles.
  erp_new_vendor_created_event:
    search_terms: [vendor, new vendor, vendor_master]
    overlap: []
    decision: keep
    scoping_added: Support rule for erp_new_vendor_paid_quickly. SigmaHQ has no ERP or accounts payable rules.
  erp_new_vendor_payment_released_event:
    search_terms: [vendor, payment_run, accounts payable]
    overlap: []
    decision: keep
    scoping_added: Support rule that mirrors erp_vendor_payment_released for use inside its own correlation. SigmaHQ has no ERP or accounts payable rules.
  erp_new_vendor_paid_quickly:
    search_terms: [vendor, new vendor, payment_run, accounts payable]
    overlap: []
    decision: keep
    scoping_added: SigmaHQ has no ERP or accounts payable rules.
