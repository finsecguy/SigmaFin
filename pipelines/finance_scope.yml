# Finance scoping for rules that use |expand placeholders.
#
# Sign-in, audit and ERP logs do not carry department or group membership, so
# SigmaFin scopes finance rules with explicit lists. Replace every value below
# with your own finance accounts and domains before deploying. The values here
# are synthetic (RFC 2606 reserved domains) and are what the test harness uses.
name: SigmaFin finance scope placeholders
priority: 30
vars:
  # Finance user principal names and shared mailboxes (AP, treasury, payroll).
  finance_mailboxes:
    - ap@finance.example.com
    - treasury@finance.example.com
    - payroll@finance.example.com
    - alice.ledger@finance.example.com
  # Finance user principal names that sign in (AP, treasury, payroll staff).
  finance_users:
    - ap.clerk@finance.example.com
    - treasury.analyst@finance.example.com
    - payroll.lead@finance.example.com
    - alice.ledger@finance.example.com
  # Two letter country codes finance staff normally sign in from. Matches the
  # SigninLogs Location column. Anything else is outside the list.
  allowed_countries:
    - US
    - GB
  # Names of ERP roles that approve payments, maintain vendor master data or
  # administer the ERP. These synthetic names are placeholders: use your own.
  privileged_erp_roles:
    - ERP_SUPER_ADMIN
    - PAYMENT_APPROVER
    - PAYMENT_RUN_ADMIN
    - VENDOR_MASTER_MAINTAINER
  # Recipient domains treated as internal. Match is on the end of the value.
  internal_domains:
    - "@corp.example.com"
transformations:
  - id: expand_finance_scope
    type: value_placeholders
