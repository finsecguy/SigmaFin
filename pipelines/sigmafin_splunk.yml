# Maps SigmaFin logsources to Splunk sourcetypes.
#
# The sourcetype values are assumptions: change them to match how your data is
# onboarded. "sigmafin:erp:*" is a made-up naming scheme for the vendor-neutral
# ERP schema in docs/erp-log-schema.md, and "sigmafin:entra:*" is a made-up name
# for sign-in data shaped like the SigninLogs table (docs/entra-fields.md). To map the generic ERP field names to
# the columns of a specific ERP audit log, add a field_name_mapping
# transformation conditioned on the same logsource (see the commented example).
name: SigmaFin Splunk logsource mapping
priority: 20
allowed_backends:
  - splunk
transformations:
  - id: erp_vendor_master_sourcetype
    type: add_condition
    conditions:
      sourcetype: sigmafin:erp:vendor_master
    rule_conditions:
      - type: logsource
        product: erp
        service: vendor_master
  - id: erp_payments_sourcetype
    type: add_condition
    conditions:
      sourcetype: sigmafin:erp:payments
    rule_conditions:
      - type: logsource
        product: erp
        service: payments
  - id: erp_user_admin_sourcetype
    type: add_condition
    conditions:
      sourcetype: sigmafin:erp:user_admin
    rule_conditions:
      - type: logsource
        product: erp
        service: user_admin
  - id: m365_audit_sourcetype
    type: add_condition
    conditions:
      sourcetype: o365:management:activity
    rule_conditions:
      - type: logsource
        product: m365
        service: audit
  - id: entra_signinlogs_sourcetype
    type: add_condition
    conditions:
      sourcetype: sigmafin:entra:signinlogs
    rule_conditions:
      - type: logsource
        product: azure
        service: signinlogs
  # Illustrative only, not tested against any real ERP:
  # - id: erp_vendor_master_field_names
