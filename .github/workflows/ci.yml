name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: No em dashes
        run: python scripts/check_no_em_dash.py
      - name: Metadata gate (references, tags, samples, ids, mirrors)
        run: python scripts/check_metadata.py
      - name: Validate rules with sigma-cli
        run: sigma check --fail-on-issues --fail-on-error rules
      - name: Tests (rule samples, harness and gate self-tests)
        run: python -m pytest -q tests
      - name: Generated docs are up to date
        run: python scripts/gen_docs.py --check
      - name: Convert rules to Splunk SPL
        run: python scripts/build_spl.py
      - name: Convert rules to KQL
        run: python scripts/build_kql.py
      - name: Publish SPL as build artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splunk-spl
          path: build/spl
          if-no-files-found: warn
      - name: Publish KQL as build artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kusto-kql
          path: build/kql
          if-no-files-found: warn
